[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langsafe"
version = "0.1.0"
description = "Find, repair and verify per-language safety drift in Tiny Aya's regional models with the Lexsi stack"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aditya Arnav" }, { name = "Pallab Das" }]
dependencies = [
    "pyyaml>=6",
    "numpy>=1.26",
    "datasets>=3.0",
    "huggingface_hub>=0.30",
    "openai>=1.40",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Model loading and FP16 evaluation work on CPU, Apple MPS, and CUDA.
models = [
    "torch>=2.7",
    "transformers>=5.15,<6",
    "accelerate>=1.0,<2",
    "peft>=0.14,<1",
]
# Keep CUDA quantization separate; bitsandbytes has no supported Darwin backend.
cuda = ["langsafe[models]", "bitsandbytes>=0.45; platform_system != 'Darwin'"]
# Backward-compatible name used by the original notebooks.
gpu = ["langsafe[cuda]"]
# SafeTune's imported repair/steering APIs use these alongside models. The
# upstream package unconditionally requires bitsandbytes and its training/eval
# stack; scripts/install_kits.sh installs its pinned source with --no-deps.
repair = ["langsafe[models]", "pandas>=1.3", "psutil>=5.9", "requests>=2.28", "rich>=12", "typer>=0.12"]
# The Lexsi kits are installed from their GitHub repos; see scripts/install_kits.sh.
dev = ["pytest>=8", "reportlab>=4"]
reporting = ["matplotlib>=3.9,<4"]

[project.scripts]
langsafe = "langsafe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
